Greenroom/ScienceBlockShape:
  Description: Requires use, try, and compare once, in that order.
  Enabled: true
  VersionAdded: '0.1'

Greenroom/UnsafeScienceBody:
  Description: Rejects return and binding in science bodies when they change behavior.
