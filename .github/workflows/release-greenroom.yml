name: Release greenroom

on:
  push:
    tags:
      - "greenroom-v*"

permissions: {}

concurrency:
  group: release-greenroom
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: gems/greenroom

    steps:
      # A tag can move to another commit. A pinned commit identifies the code that runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          # Pinned rather than "latest": this job runs the suite as the gate
          # before a push nobody can take back, so a Ruby released this morning
          # must not decide whether a release goes out.
          ruby-version: '4.0.6'
          bundler-cache: true
          working-directory: gems/greenroom
      - name: Verify the tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_version="${RELEASE_TAG#greenroom-v}"
          gem_version="$(bundle exec ruby -Ilib -rgreenroom/version -e 'print Greenroom::VERSION')"
          if [ "$tag_version" != "$gem_version" ]; then
            echo "The tag version $tag_version does not match the gem version $gem_version." >&2
            exit 1
          fi
      - name: Run the default task
        run: bundle exec rake
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Build the gem
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#greenroom-v}"
          mkdir -p pkg
          bundle exec gem build greenroom.gemspec --output "pkg/greenroom-${version}.gem"
      - name: Push the gem
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#greenroom-v}"
          if output=$(gem push "pkg/greenroom-${version}.gem" 2>&1); then
            echo "$output"
          else
            echo "$output"
            if ! echo "$output" | grep -q "Repushing of gem versions is not allowed"; then
              exit 1
            fi
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#greenroom-v}"
          gem_path="pkg/greenroom-${version}.gem"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "$gem_path"
          else
            gh release create "$RELEASE_TAG" --generate-notes "$gem_path"
          fi
