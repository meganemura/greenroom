name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: ${{ matrix.gem }} / Ruby ${{ matrix.ruby }}
    defaults:
      run:
        working-directory: gems/${{ matrix.gem }}
    strategy:
      fail-fast: false
      matrix:
        # Every gem in the repository runs here. A gem left out of this list
        # is a gem whose suite only ever runs on someone's laptop.
        gem:
          - greenroom
          - rubocop-greenroom
        # The floor each gemspec declares, and the version development uses.
        # Running both means a change that needs a newer Ruby fails here
        # rather than in a host application sitting on the floor.
        ruby:
          - '3.3'
          - '4.0.6'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: gems/${{ matrix.gem }}
      - name: Run the default task
        run: bundle exec rake
